[tool.pytest.ini_options]
testpaths = ["services/api/tests", "services/brain/tests", "infra/seed", "evals"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
pythonpath = ["services/brain/src"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["services/api/src", "services/brain/src"]
files = [
    "services/api/src/api",
    "services/api/tests",
    "services/brain/src/brain",
    "services/brain/tests",
    "evals/retrieval.py",
    "evals/test_retrieval.py",
    "infra/seed/generate.py",
    "infra/seed/test_generate.py",
]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
