components:
  schemas:
    AccessWindow:
      properties:
        start:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start
        end:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End
      additionalProperties: false
      type: object
      title: AccessWindow
      description: The resident-supplied preferred access window, if one was provided.
    AgentRunRequest:
      properties:
        description:
          type: string
          maxLength: 20000
          minLength: 1
          title: Description
      additionalProperties: false
      type: object
      required:
      - description
      title: AgentRunRequest
    AgentRunResponse:
      properties:
        run_id:
          type: string
          format: uuid
          title: Run Id
        status:
          type: string
          enum:
          - completed
          - abstained
          - emergency
          title: Status
        summary:
          type: string
          title: Summary
        facts:
          anyOf:
          - $ref: '#/components/schemas/TicketFacts'
          - type: 'null'
      type: object
      required:
      - run_id
      - status
      - summary
      title: AgentRunResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Identity:
      properties:
        org_id:
          type: string
          format: uuid
          title: Org Id
        person_id:
          type: string
          format: uuid
          title: Person Id
        role:
          type: string
          enum:
          - resident
          - property_manager
          - maintenance_technician
          - vendor_contact
          - asset_owner
          - operations_admin
          title: Role
      type: object
      required:
      - org_id
      - person_id
      - role
      title: Identity
    ProcessingResult:
      properties:
        run_id:
          type: string
          format: uuid
          title: Run Id
        processed:
          type: boolean
          title: Processed
      type: object
      required:
      - run_id
      - processed
      title: ProcessingResult
    RunResult:
      properties:
        run_id:
          type: string
          format: uuid
          title: Run Id
        ticket_id:
          type: string
          format: uuid
          title: Ticket Id
        status:
          type: string
          title: Status
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
      type: object
      required:
      - run_id
      - ticket_id
      - status
      title: RunResult
    RunSnapshot:
      properties:
        run_id:
          type: string
          format: uuid
          title: Run Id
        status:
          type: string
          title: Status
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
      type: object
      required:
      - run_id
      - status
      title: RunSnapshot
    SubmitTicketRequest:
      properties:
        description:
          type: string
          maxLength: 20000
          minLength: 1
          title: Description
        tenancy_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Tenancy Id
        access_permission:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Access Permission
        pets_present:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Pets Present
      additionalProperties: false
      type: object
      required:
      - description
      title: SubmitTicketRequest
    TenancyList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/TenancyLocation'
          type: array
          title: Items
      type: object
      required:
      - items
      title: TenancyList
    TenancyLocation:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        property_name:
          type: string
          title: Property Name
        unit_name:
          type: string
          title: Unit Name
      type: object
      required:
      - id
      - property_name
      - unit_name
      title: TenancyLocation
    TicketDetail:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        ticket_number:
          type: integer
          title: Ticket Number
        property_id:
          type: string
          format: uuid
          title: Property Id
        building_id:
          type: string
          format: uuid
          title: Building Id
        unit_id:
          type: string
          format: uuid
          title: Unit Id
        status:
          type: string
          title: Status
        priority:
          anyOf:
          - type: string
          - type: 'null'
          title: Priority
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
        symptom_summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Symptom Summary
        submitted_at:
          type: string
          format: date-time
          title: Submitted At
        closed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Closed At
        created_at:
          type: string
          format: date-time
          title: Created At
