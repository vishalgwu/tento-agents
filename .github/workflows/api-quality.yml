name: Python quality

on:
  pull_request:
    paths:
      - '.github/workflows/api-quality.yml'
      - 'knowledge/**'
      - 'infra/migrations/**'
      - 'infra/seed/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements.lock.txt'
      - 'services/api/**'
      - 'services/brain/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/api-quality.yml'
      - 'knowledge/**'
      - 'infra/migrations/**'
      - 'infra/seed/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements.lock.txt'
      - 'services/api/**'
      - 'services/brain/**'

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.12 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned direct dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Verify environment
        run: python -m pip check
      - name: Format check
        run: python -m ruff format --check services/api services/brain infra/seed
      - name: Lint
        run: python -m ruff check services/api services/brain infra/seed
      - name: Type check
        run: python -m mypy
      - name: Test API, retrieval, and seed invariants
        run: python -m pytest -q
